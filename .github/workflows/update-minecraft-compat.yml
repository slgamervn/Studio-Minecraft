name: Refresh Minecraft compatibility data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh official Script API version
        run: node .github/scripts/update-minecraft-compat.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/minecraft-compat.json; then
            echo "Compatibility data already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/minecraft-compat.json
          git commit -m "chore: refresh Minecraft compatibility data"
          git push
