name: Validate Studio source

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check sw.js
          node --check .github/scripts/update-minecraft-compat.mjs
          node --check .github/scripts/validate-studio.mjs
      - name: Check inline JavaScript syntax and compatibility data
        run: node .github/scripts/validate-studio.mjs
